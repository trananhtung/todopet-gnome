name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Test on the platform the extension targets (Ubuntu 26.04, GNOME 50, gjs 1.88).
    # Older gjs (1.80 on ubuntu-24.04) lacks Intl.Segmenter, which core/dates.js needs.
    container: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # The container runs as root and starts almost empty: git for checkout, make,
      # tzdata for TZ=Asia/Ho_Chi_Minh in the tests, and fonts for the Pango drawing.
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates make tzdata \
            fonts-dejavu-core fonts-noto-color-emoji \
            gjs gir1.2-soup-3.0 gir1.2-secret-1 gir1.2-pango-1.0 gir1.2-gdkpixbuf-2.0 libglib2.0-bin

      - uses: actions/checkout@v6

      # ESLint 10 needs Node 20.19+.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Snapshots
        run: make snapshot

      - name: Upload snapshots
        uses: actions/upload-artifact@v6
        with:
          name: snapshots
          path: out/
          if-no-files-found: ignore
